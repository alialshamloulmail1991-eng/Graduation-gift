<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120f">
  <title>✦</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <section class="lock-screen" id="lockScreen">
    <div class="lock-glow"></div>
    <div class="lock-card">
      <div class="cap-art" aria-hidden="true">✦ <span>🎓</span> ✦</div>
      <form id="passwordForm">
        <label class="visually-hidden" for="passwordInput">كلمة السر</label>
        <input id="passwordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" aria-label="كلمة السر" required>
        <button class="gold-button icon-only" type="submit" aria-label="فتح الموقع">↗</button>
        <p class="error" id="errorMessage" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <main id="giftSite" class="hidden">
    <nav class="nav wrap" aria-label="التنقل">
      <a class="wordmark" href="#top" aria-label="البداية"><span>✦</span></a>
      <div class="nav-actions">
        <a href="#memories" aria-label="الصور">♡</a>
        <a href="#film" aria-label="الفيديو">▷</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="تبديل الوضع" title="تبديل الوضع"><span id="themeIcon">☾</span></button>
      </div>
    </nav>

    <section class="hero wrap" id="top" aria-label="الصورة الأولى">
      <div class="hero-visual">
        <div class="photo-backdrop"></div>
        <img src="assets/graduation-photo-1.jpg" alt="" class="hero-image">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
      </div>
    </section>

    <section class="wrap memories section" id="memories" aria-label="الصورة الثانية">
      <div class="gallery gallery-single">
        <figure class="gallery-card gallery-small">
          <div class="image-wrap"><img src="assets/graduation-photo-2.jpg" alt="" loading="lazy"></div>
        </figure>
      </div>
    </section>

    <section class="film-section" id="film" aria-label="الفيديو">
      <div class="wrap section">
        <div class="video-frame"><video id="giftVideo" controls playsinline preload="metadata" poster="assets/graduation-photo-2.jpg"><source src="assets/graduation-video.mp4" type="video/mp4"></video></div>
      </div>
    </section>

    <section class="countdown-section wrap" id="the-surprise" aria-label="العد التنازلي والمفاجأة">
      <div class="countdown-card">
        <div class="countdown-grid" id="countdownGrid" aria-label="الوقت المتبقي">
          <div class="time-tile"><strong id="countDays">—</strong></div>
          <div class="time-tile"><strong id="countHours">—</strong></div>
          <div class="time-tile"><strong id="countMinutes">—</strong></div>
          <div class="time-tile"><strong id="countSeconds">—</strong></div>
        </div>
        <div class="gift-reveal hidden" id="giftReveal">
          <button class="gift-box-button" id="openGiftBox" type="button" aria-label="فتح الصندوق" aria-expanded="false">
            <span class="gift-bow" aria-hidden="true">✦</span><span class="gift-lid"></span><span class="gift-box"><i></i></span><span class="gift-spark spark-one">✧</span><span class="gift-spark spark-two">✦</span>
          </button>
          <div class="gift-message hidden" id="giftMessage" aria-live="polite" aria-label="المفاجأة">
            <span class="message-cap" aria-hidden="true">🎓 ✦ 🎓</span>
            <span class="message-sparkle" aria-hidden="true">✦ ✧ ✦</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="floating-music" id="floatingMusic" aria-label="التحكم في الأغنية">
    <span class="floating-music-note" aria-hidden="true">♫</span>
    <button id="musicToggle" type="button" aria-label="تشغيل الأغنية" title="تشغيل أو إيقاف الأغنية"><span id="musicIcon">▶</span></button>
    <audio id="giftSong" preload="auto" loop><source src="assets/graduation-song.mp3" type="audio/mpeg"></audio>
  </div>
  <script src="app.js"></script>
</body>
</html>
